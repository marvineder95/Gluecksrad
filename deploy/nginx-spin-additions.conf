# In den bestehenden HTTPS-server{}-Block von spin.kwlc.pl einfügen
# (der von certbot verwaltete 443-Block). NUR diese location-Blöcke hinzufügen.

    # Go-API
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # WebSocket (Task 4 Phase 2 – Pairing/Notifications). Schadet nicht, wenn schon jetzt gesetzt.
    location /ws {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # Hochgeladene Bilder (von der Go-API nach /var/www/gluecksrad/uploads geschrieben)
    location /uploads/ {
        alias /var/www/gluecksrad/uploads/;
        location ~* \.(php|phtml|phar|pl|py|sh|cgi)$ { deny all; }
    }

    # Statisches Frontend + SPA-Fallback (index.html, frontend/js, css, assets).
    # WICHTIG: sollte NACH einem evtl. vorhandenen PHP-location stehen; PHP wird nach
    # dem Cutover nicht mehr gebraucht (Frontend ruft /api statt /backend/api/*.php).
    location / {
        root /var/www/gluecksrad;
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 25M;
