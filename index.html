<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b155d">
    <title>Point4 Spin</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192x192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192x192.png">
    <link rel="stylesheet" href="frontend/css/style.css?v=112">
    <link rel="stylesheet" href="frontend/css/landing-new.css?v=112">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&family=Open+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Roboto:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <component :is="currentComponent"></component>
    </div>

    <!-- Templates -->
    <template id="wheel-template">
        <svg ref="svgRef" class="wheel-svg" :style="wheelStyle">
            <defs>
                <!-- Drop shadow for segments -->
                <filter id="segShadow" x="-30%" y="-30%" width="160%" height="160%">
                    <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="rgba(0,0,0,0.08)"/>
                </filter>
                <!-- Product image floating shadow -->
                <filter id="productShadow" x="-50%" y="-50%" width="200%" height="200%">
                    <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.18)"/>
                    <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.1)"/>
                </filter>
                <!-- Neon glow for rim (Tech-Skin) -->
                <filter id="rimGlow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="4" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
                <!-- Gold rim gradients -->
                <linearGradient id="goldRim1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#F0E2B8"/>
                    <stop offset="25%" stop-color="#D4B87A"/>
                    <stop offset="50%" stop-color="#C8A866"/>
                    <stop offset="75%" stop-color="#E0CC90"/>
                    <stop offset="100%" stop-color="#B89850"/>
                </linearGradient>
                <linearGradient id="goldRim2" x1="100%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#E8D5A3"/>
                    <stop offset="50%" stop-color="#F5ECD0"/>
                    <stop offset="100%" stop-color="#A68B4B"/>
                </linearGradient>
                <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
                    <stop offset="60%" stop-color="rgba(255,255,255,0.6)"/>
                    <stop offset="100%" stop-color="rgba(200,168,102,0.15)"/>
                </radialGradient>
                <!-- Clip paths for each segment -->
                <clipPath v-for="clip in clipPaths" :key="clip.id" :id="clip.id">
                    <path :d="clip.path" fill="white" />
                </clipPath>
                <!-- Curved text paths along outer edge -->
                <path v-for="tp in textPaths" :key="tp.id" :id="tp.id" :d="tp.d" fill="none" />
            </defs>

            <!-- === OUTER PREMIUM RIM === -->
            <g :filter="sk.rim_glow === '1' ? 'url(#rimGlow)' : null">
                <circle v-if="accent" :cx="center" :cy="center" :r="radius + 18" fill="none" :stroke="accent" stroke-width="3" opacity="0.55"/>
                <circle :cx="center" :cy="center" :r="radius + 14" fill="none" :stroke="sk.rim_style === 'gold' ? 'url(#goldRim1)' : sk.rim_color" stroke-width="5" opacity="0.95"/>
                <circle :cx="center" :cy="center" :r="radius + 10" fill="none" :stroke="sk.rim_style === 'gold' ? 'url(#goldRim2)' : sk.rim_color" stroke-width="2" opacity="0.8"/>
                <circle :cx="center" :cy="center" :r="radius + 7" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1"/>
            </g>

            <!-- === SEGMENTS (background + overlay + content, all clipped) === -->
            <g v-if="segmentPaths.length > 0" filter="url(#segShadow)">
                <g v-for="(segment, index) in segmentPaths" :key="'seg-' + index">
                    <!-- Background: Theme-Bild ODER Segmentfarbe (fill_mode) -->
                    <g :clip-path="'url(#clip-' + index + ')'">
                        <image v-if="sk.segment_fill_mode !== 'color'" :href="segment.theme.image"
                               :x="center - radius" :y="center - radius"
                               :width="radius * 2" :height="radius * 2"
                               preserveAspectRatio="xMidYMid slice"/>
                        <path v-else :d="segment.path" :fill="segment.color" style="pointer-events: none;"/>
                        <!-- Overlay for text readability (nur bei Bild-Modus) -->
                        <path v-if="sk.segment_fill_mode !== 'color'" :d="segment.path" :fill="overlayColor" style="pointer-events: none;"/>

                        <!-- === SEGMENT TITLES (curved along outer edge) === -->
                        <text v-if="sk.label_enabled !== '0'"
                            :fill="sk.label_color"
                            :font-size="segment.fontSize * labelScale"
                            font-weight="700"
                            :font-family="(font || 'Montserrat') + ', sans-serif'"
                            style="text-shadow: 0 1px 4px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3);">
                            <textPath :href="'#' + textPaths[index].id"
                                startOffset="50%"
                                text-anchor="middle">
                                {{ segment.name }}
                            </textPath>
                        </text>

                        <!-- === PRODUCT IMAGES (rotated to segment bisector) -->
                        <g v-if="segment.image" style="pointer-events: none;">
                            <g :transform="'translate(' + segment.imageX + ' ' + segment.imageY + ') rotate(' + segment.imageRotation + ')'">
                                <image :x="-segment.boxWidth / 2"
                                       :y="-segment.boxHeight / 2"
                                       :width="segment.boxWidth"
                                       :height="segment.boxHeight"
                                       :href="segment.image"
                                       filter="url(#productShadow)"
                                       preserveAspectRatio="xMidYMid meet"/>
                            </g>
                        </g>
                    </g>
                    <!-- Subtle separator stroke (NOT clipped, drawn on top of adjacent segments) -->
                    <path :d="segment.path" fill="none" :stroke="sk.separator_color" stroke-width="2" opacity="0.6" style="pointer-events: none;"/>
                </g>
            </g>

            <!-- === EMPTY STATE: No segments === -->
            <g v-else filter="url(#segShadow)">
                <circle :cx="center" :cy="center" :r="radius" fill="#F8F4EC" stroke="none"/>
                <circle :cx="center" :cy="center" :r="radius" fill="url(#goldRim1)" opacity="0.08"/>
                <!-- Curved text path in upper half of wheel -->
                <path :id="'emptyArc-' + (segments ? segments.length : 0)"
                      :d="'M ' + (center - radius * 0.62) + ' ' + (center - radius * 0.35) +
                          ' A ' + (radius * 0.72) + ' ' + (radius * 0.72) +
                          ' 0 0 1 ' + (center + radius * 0.62) + ' ' + (center - radius * 0.35)"
                      fill="none"/>
                <text text-anchor="middle"
                      :font-size="Math.max(15, radius * 0.048)"
                      font-weight="600"
                      font-family="Montserrat, sans-serif"
                      fill="#8B7355">
                    <textPath :href="'#emptyArc-' + (segments ? segments.length : 0)"
                              startOffset="50%">
                        ✨  Fang an, dein Rad zu gestalten  ✨
                    </textPath>
                </text>
            </g>

            <!-- === SEGMENT DIVIDERS (subtle lines between segments; entfallen bei Lücke) === -->
            <g v-if="segmentPaths.length > 0 && gapDeg === 0" v-for="(segment, index) in segmentPaths" :key="'div'+index" style="pointer-events: none;">
                <line :x1="center" :y1="center"
                      :x2="center + radius * Math.cos((index * (360 / segmentPaths.length) - 90) * Math.PI / 180)"
                      :y2="center + radius * Math.sin((index * (360 / segmentPaths.length) - 90) * Math.PI / 180)"
                      :stroke="sk.separator_color" stroke-width="1.5" opacity="0.5"/>
            </g>

            <!-- === HUB (Mitte) – Form je nach hub_style === -->
            <g v-if="sk.hub_style === 'classic'" style="pointer-events: none;">
                <circle :cx="center" :cy="center" :r="radius * 0.18" fill="none" :stroke="sk.rim_style === 'gold' ? 'url(#goldRim1)' : sk.hub_color" stroke-width="3" opacity="0.9"/>
                <circle :cx="center" :cy="center" :r="radius * 0.15" fill="none" :stroke="sk.rim_style === 'gold' ? 'url(#goldRim2)' : sk.hub_color" stroke-width="1.5" opacity="0.7"/>
                <circle :cx="center" :cy="center" :r="radius * 0.12" fill="url(#centerGlow)"/>
            </g>
            <g v-else-if="sk.hub_style === 'dot'" style="pointer-events: none;">
                <circle :cx="center" :cy="center" :r="radius * 0.12" :fill="sk.hub_color"/>
                <circle :cx="center - radius*0.035" :cy="center - radius*0.035" :r="radius * 0.03" fill="rgba(255,255,255,0.55)"/>
            </g>
            <g v-else-if="sk.hub_style === 'ring'" style="pointer-events: none;">
                <circle :cx="center" :cy="center" :r="radius * 0.13" fill="#FFFFFF" :stroke="sk.hub_color" :stroke-width="radius*0.03"/>
            </g>
            <g v-else-if="sk.hub_style === 'glow'" style="pointer-events: none;">
                <circle :cx="center" :cy="center" :r="radius * 0.14" :fill="sk.hub_color" filter="url(#rimGlow)" opacity="0.9"/>
                <circle :cx="center" :cy="center" :r="radius * 0.07" fill="#0B1120"/>
                <circle :cx="center" :cy="center" :r="radius * 0.03" fill="#FFFFFF"/>
            </g>
            <g v-else-if="sk.hub_style === 'star'" style="pointer-events: none;">
                <circle :cx="center" :cy="center" :r="radius * 0.15" :fill="sk.hub_color"/>
                <circle :cx="center" :cy="center" :r="radius * 0.15" fill="none" :stroke="accent || sk.pointer_color" stroke-width="2" opacity="0.5"/>
                <text :x="center" :y="center" text-anchor="middle" dominant-baseline="central" :font-size="radius * 0.17" :fill="accent || sk.pointer_color || '#F472B6'">★</text>
            </g>
            <g v-else-if="sk.hub_style === 'gem'" style="pointer-events: none;">
                <circle :cx="center" :cy="center" :r="radius * 0.15" fill="none" :stroke="sk.rim_style === 'gold' ? 'url(#goldRim1)' : sk.hub_color" stroke-width="3"/>
                <circle :cx="center" :cy="center" :r="radius * 0.13" fill="#1A0A0F"/>
                <text :x="center" :y="center" text-anchor="middle" dominant-baseline="central" :font-size="radius * 0.15" :fill="sk.hub_color">◆</text>
            </g>

            <!-- === POINTER (bleibt oben, dreht mit Gegenrotation nicht mit) === -->
            <g v-if="sk.pointer_enabled !== '0'" :transform="'rotate(' + (-(rotation || 0)) + ' ' + center + ' ' + center + ')'" style="pointer-events: none;">
                <g style="filter: drop-shadow(0 2px 4px rgba(0,0,0,0.35));">
                    <!-- triangle: breiter, scharfer Zeiger -->
                    <polygon v-if="sk.pointer_style === 'triangle'"
                             :points="(center - 14) + ',' + (center - radius - 16) + ' ' + (center + 14) + ',' + (center - radius - 16) + ' ' + center + ',' + (center - radius + 12)"
                             :fill="sk.pointer_color" stroke="rgba(0,0,0,0.25)" stroke-width="1"/>
                    <!-- tab: runde Lasche (Bubbly) -->
                    <rect v-else-if="sk.pointer_style === 'tab'"
                          :x="center - 12" :y="center - radius - 22" width="24" height="40" rx="12"
                          :fill="sk.pointer_color" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
                    <!-- arrow: schlanker, langer Pfeil (Tech) -->
                    <polygon v-else-if="sk.pointer_style === 'arrow'"
                             :points="(center - 7) + ',' + (center - radius - 24) + ' ' + (center + 7) + ',' + (center - radius - 24) + ' ' + (center + 7) + ',' + (center - radius - 6) + ' ' + center + ',' + (center - radius + 14) + ' ' + (center - 7) + ',' + (center - radius - 6)"
                             :fill="sk.pointer_color"/>
                    <!-- diamond: Raute (Glamour) -->
                    <polygon v-else-if="sk.pointer_style === 'diamond'"
                             :points="center + ',' + (center - radius - 22) + ' ' + (center + 13) + ',' + (center - radius - 4) + ' ' + center + ',' + (center - radius + 14) + ' ' + (center - 13) + ',' + (center - radius - 4)"
                             :fill="sk.pointer_color" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
                </g>
            </g>
        </svg>
    </template>

    <template id="segment-image-editor-template">
        <div class="segment-image-editor">
            <svg class="segment-image-editor-svg" width="400" height="400" viewBox="0 0 400 400">
                <defs>
                    <clipPath :id="clipId">
                        <path :d="wedgePath" fill="white"/>
                    </clipPath>
                    <filter id="editorProductShadow" x="-50%" y="-50%" width="200%" height="200%">
                        <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.18)"/>
                        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.1)"/>
                    </filter>
                </defs>
                <g :clip-path="'url(#' + clipId + ')'">
                    <image :href="theme.image" :x="center - radius" :y="center - radius"
                           :width="radius * 2" :height="radius * 2" preserveAspectRatio="xMidYMid slice"/>
                    <path :d="wedgePath" :fill="theme.overlay" style="pointer-events: none;"/>

                    <g v-if="segment && segment.image"
                       :transform="'translate(' + currentImageX + ' ' + currentImageY + ') rotate(' + currentImageRotation + ')'"
                       style="cursor: move;"
                       @pointerdown="onPointerDown">
                        <image :x="-layout.boxWidth / 2"
                               :y="-layout.boxHeight / 2"
                               :width="layout.boxWidth"
                               :height="layout.boxHeight"
                               :href="segment.image"
                               filter="url(#editorProductShadow)"
                               preserveAspectRatio="xMidYMid meet"
                               style="pointer-events: all;"/>
                    </g>
                </g>
                <path :d="wedgePath" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="2" style="pointer-events: none;"/>
            </svg>

            <div class="segment-image-editor-controls">
                <div class="segment-image-editor-control">
                    <label>Rotation</label>
                    <input type="range" min="-180" max="180" step="1" :value="rotation" @input="onRotationInput">
                    <span class="segment-image-editor-value">{{ rotationDisplay }}°</span>
                </div>
                <div class="segment-image-editor-control">
                    <label>Größe</label>
                    <input type="range" min="0.2" max="2" step="0.05" :value="scale" @input="onScaleInput">
                    <span class="segment-image-editor-value">{{ scaleDisplay }}</span>
                </div>
                <button type="button" class="btn-ghost btn-small" @click="resetTransform">
                    Position, Rotation & Größe zurücksetzen
                </button>
            </div>
        </div>
    </template>

    <template id="event-template">
        <div class="event-page">
            <div class="event-bg-image" :style="bgStyle"></div>

            <!-- Decorative elements -->
            <div class="feather-decor feather-decor-1"></div>
            <div class="feather-decor feather-decor-2"></div>
            <div class="feather-decor feather-decor-3"></div>

            <div class="event-header">
                <div class="logo-wrapper">
                    <img :src="logoUrl" class="logo-taube-img" alt="Logo">
                </div>
                <div class="gold-line"></div>
            </div>

            <!-- Lead Capture Form -->
            <div v-if="leadCaptureEnabled && showLeadForm && !campaignEnded" class="lead-form-container">
                <div class="lead-form-card">
                    <div class="lead-form-icon">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                    </div>
                    <h3 class="lead-form-title">Gleich geht's los!</h3>
                    <p class="lead-form-subtitle">Trage dich ein, um am Gewinnspiel teilzunehmen.</p>
                    <div class="lead-form-fields">
                        <input
                            type="text"
                            v-model="leadForm.name"
                            placeholder="Dein Name"
                            class="lead-form-input"
                            @keyup.enter="submitLead()"
                        >
                        <input
                            type="email"
                            v-model="leadForm.email"
                            placeholder="Deine E-Mail-Adresse"
                            class="lead-form-input"
                            @keyup.enter="submitLead()"
                        >
                        <label class="lead-consent-label">
                            <input type="checkbox" v-model="consentGiven">
                            <span>Ich stimme der Verarbeitung meiner Daten sowie den Teilnahmebedingungen zu.</span>
                        </label>
                    </div>
                    <p v-if="leadError" class="lead-form-error">{{ leadError }}</p>
                    <button class="lead-form-submit" @click="submitLead()">
                        <span>Weiter zum Glücksrad</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                    </button>
                    <button class="lead-form-skip" @click="skipLead">Überspringen</button>
                </div>
            </div>

            <div class="wheel-area" ref="wheelAreaRef">
                <div class="wheel-wrapper" :style="{ maxWidth: wheelSize + 'px', maxHeight: wheelSize + 'px' }">
                    <div class="wheel-marker">
                        <svg viewBox="0 0 50 60">
                            <defs>
                                <linearGradient id="markerGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" stop-color="#E8D5A3"/>
                                    <stop offset="50%" stop-color="#C8A866"/>
                                    <stop offset="100%" stop-color="#A68B4B"/>
                                </linearGradient>
                            </defs>
                            <path d="M25 58 L6 18 Q6 2 25 2 Q44 2 44 18 Z" fill="url(#markerGrad2)" stroke="#A68B4B" stroke-width="1.5"/>
                            <circle cx="25" cy="16" r="7" fill="#fff" stroke="#C8A866" stroke-width="1.5"/>
                        </svg>
                    </div>
                    <wheel-component :segments="segments" :rotation="rotation" :size="wheelSize"></wheel-component>
                    <div class="wheel-center">
                        <img :src="logoUrl" alt="Logo" class="center-taube">
                    </div>
                </div>
            </div>

            <!-- Kampagne abgeschlossen Overlay -->
            <div v-if="campaignEnded" class="campaign-ended-overlay">
                <div class="campaign-ended-content">
                    <div class="campaign-ended-icon">🏆</div>
                    <h2>Kampagne abgeschlossen</h2>
                    <p>Alle Gewinne wurden vergeben.</p>
                    <p class="campaign-ended-sub">Vielen Dank für Ihre Teilnahme!</p>
                    <p class="campaign-ended-hint">Erstelle eine neue Kampagne oder erhöhe die Anzahl der zu drehenden Segmente im Admin-Panel.</p>
                    <button class="campaign-admin-btn" @click="navigateTo('#/dashboard')">Zum Dashboard</button>
                </div>
            </div>

            <div class="spin-area" v-else>
                <button class="spin-button" @click="spin()" :disabled="spinning || showWin || (leadCaptureEnabled && showLeadForm)">
                    {{ spinning ? 'Dreht...' : 'DREHEN' }}
                </button>
                <div class="spin-hint">Buzzer drücken zum drehen</div>
            </div>

            <!-- Secret Admin Corner -->
            <div class="secret-corner" @click="handleSecretClick"></div>

            <Transition name="win-fade">
                <div v-if="showWin" class="win-overlay" @click.self="nextRound">
                    <div class="win-content">
                        <div class="win-badge">GEWONNEN!</div>
                        <img v-if="winner?.image" :src="winner.image" class="win-image" alt="">
                        <div class="win-name">{{ winner?.name }}</div>
                        <div class="win-text">{{ winner?.win_text || 'Herzlichen Glückwunsch!' }}</div>
                        <button class="next-round-btn" @click="nextRound">NÄCHSTE RUNDE</button>
                    </div>
                </div>
            </Transition>

            <canvas ref="confettiCanvas" class="confetti-canvas"></canvas>
        </div>
    </template>

    <template id="landing-template">
        <div class="landing-page">
            <!-- Navigation -->
            <nav class="landing-nav">
                <a href="#" class="landing-nav-logo" aria-label="Zum Seitenanfang">
                    <img src="frontend/assets/img/point4spinLogo.png" alt="Point4 Spin">
                </a>

                <div class="landing-nav-links">
                    <a href="#use-cases">Einsatzbereiche</a>
                    <a href="#benefits">Vorteile</a>
                    <a href="#how-it-works">So funktioniert’s</a>
                    <a href="#references">Referenzen</a>
                    <a href="#pricing">Preise</a>
                    <a href="#contact">Kontakt</a>
                </div>

                <div class="landing-nav-actions">
                    <a href="#contact" class="landing-nav-btn-demo">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        <span>Demo anfragen</span>
                    </a>
                    <a href="#/login" @click.prevent="openLogin" class="landing-nav-btn-login">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        <span>Login</span>
                    </a>
                </div>

                <button type="button" class="landing-nav-mobile-toggle" @click="toggleMobileMenu" aria-label="Menü öffnen">
                    <svg v-if="!mobileMenuOpen" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                    <svg v-else width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>

                <div class="landing-nav-mobile-menu" :class="{ 'is-open': mobileMenuOpen }">
                    <a href="#use-cases" @click="closeMobileMenu">Einsatzbereiche</a>
                    <a href="#benefits" @click="closeMobileMenu">Vorteile</a>
                    <a href="#how-it-works" @click="closeMobileMenu">So funktioniert’s</a>
                    <a href="#references" @click="closeMobileMenu">Referenzen</a>
                    <a href="#pricing" @click="closeMobileMenu">Preise</a>
                    <a href="#contact" @click="closeMobileMenu">Kontakt</a>
                    <div class="landing-nav-mobile-actions">
                        <a href="#contact" class="landing-btn-primary" @click="closeMobileMenu">Demo anfragen</a>
                        <a href="#/login" class="landing-btn-outline" @click.prevent="openLogin; closeMobileMenu();">Login</a>
                    </div>
                </div>
            </nav>

            <!-- Hero Section (unverändert) -->
            <section class="landing-hero-section">
                <div class="landing-hero-bg">

                    <button class="superadmin-logout" @click="logout">Abmelden</button>
                </div>
            </header>
            <main class="superadmin-main">
                <div class="superadmin-hero">
                    <div class="superadmin-hero-content">
                        <h1>Willkommen im Admin-Bereich</h1>
                        <p>Verwalte hier deine Kunden und dein Profil.</p>
                    </div>
                    <div class="superadmin-hero-glow"></div>
                </div>
                <!-- Eigenes Profil -->
                <div class="superadmin-section">
                    <div class="superadmin-section-header">
                        <h2>Mein Profil</h2>
                    </div>
                    <div class="settings-profile">
                        <div class="settings-profile-info">
                            <div class="settings-profile-email">{{ currentUser.email }}</div>
                            <div class="settings-profile-role">Super Admin</div>
                        </div>
                        <div class="settings-profile-actions">
                            <button class="dashboard-btn" @click="openOwnEmailModal">E-Mail ändern</button>
                            <button class="dashboard-btn" @click="openOwnPasswordModal">Passwort ändern</button>
                        </div>
                    </div>
                </div>

                <!-- Kundenverwaltung -->
                <div class="superadmin-section">
                    <div class="superadmin-section-header">
                        <h2>Kundenverwaltung</h2>
                        <button class="dashboard-btn dashboard-btn-primary" @click="openCustomerModal()">+ Kunde anlegen</button>
                    </div>
                    <table class="superadmin-table">
                        <thead>
                            <tr><th>Firma</th><th>Kontakt</th><th>E-Mail</th><th>Subdomain</th><th>Status</th><th>Drehungen</th><th>Aktionen</th></tr>
                        </thead>
                        <tbody>
                            <tr v-for="c in customers" :key="c.id">
                                <td>{{ c.company_name }}</td>
                                <td>{{ c.contact_name }}</td>
                                <td>{{ c.email }}</td>
                                <td>{{ c.subdomain }}</td>
                                <td><span :class="'status-badge ' + (c.is_active ? 'active' : 'inactive')">{{ c.is_active ? 'Aktiv' : 'Inaktiv' }}</span></td>
                                <td>{{ c.spin_count }}</td>
                                <td>
                                    <button class="superadmin-icon-btn" @click="openCustomerModal(c)" title="Bearbeiten">✎</button>
                                    <button class="superadmin-icon-btn" @click="toggleCustomer(c)" :title="c.is_active ? 'Deaktivieren' : 'Aktivieren'">{{ c.is_active ? '⏻' : '⏼' }}</button>
                                    <button class="superadmin-icon-btn superadmin-icon-btn-danger" @click="openConfirm(c)" title="Löschen">🗑</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>

            <!-- Kunde Modal -->
            <div v-if="showCustomerModal" class="modal-overlay" @click.self="showCustomerModal = false">
                <div class="modal-card">
                    <h3>{{ editingCustomer ? 'Kunde bearbeiten' : 'Neuer Kunde' }}</h3>
                    <div class="modal-field">
                        <label>Firmenname</label>
                        <input type="text" v-model="customerForm.company_name" placeholder="Unternehmen GmbH">
                    </div>
                    <div class="modal-field">
                        <label>Kontaktperson</label>
                        <input type="text" v-model="customerForm.contact_name" placeholder="Max Mustermann">
                    </div>
                    <div class="modal-field">
                        <label>E-Mail (Login für den Kunden)</label>
                        <input type="email" v-model="customerForm.email" placeholder="kunde@unternehmen.at">
                    </div>
                    <div class="modal-field">
                        <label>Subdomain (optional)</label>
                        <input type="text" v-model="customerForm.subdomain" placeholder="unternehmen">
                    </div>
                    <div class="modal-actions">
                        <button class="dashboard-btn" @click="showCustomerModal = false">Abbrechen</button>
                        <button class="dashboard-btn dashboard-btn-primary" @click="saveCustomer" :disabled="savingCustomer">
                            {{ savingCustomer ? 'Wird gespeichert...' : 'Speichern' }}
                        </button>
                    </div>
                </div>
            </div>

            <!-- Lösch-Bestätigung Modal -->
            <div v-if="showConfirmModal" class="modal-overlay" @click.self="cancelDelete">
                <div class="modal-card modal-card-confirm">
                    <h3>Kunde löschen</h3>
                    <p class="confirm-text">
                        Möchten Sie <strong>{{ confirmCustomer ? confirmCustomer.company_name : '' }}</strong> wirklich löschen?
                        <span class="confirm-warning">Alle zugehörigen Benutzer, Segmente, Einstellungen und Drehungen werden ebenfalls gelöscht.</span>
                    </p>
                    <div class="modal-actions">
                        <button class="dashboard-btn" @click="cancelDelete">Abbrechen</button>
                        <button class="dashboard-btn dashboard-btn-danger" @click="confirmDelete">Löschen</button>
                    </div>
                </div>
            </div>

            <!-- Zugangsdaten Benachrichtigung Modal -->
            <div v-if="showCredentialsModal" class="modal-overlay" @click.self="closeCredentialsModal">
                <div class="modal-card modal-card-credentials">
                    <h3>{{ newCredentials.error ? 'Kunde angelegt – E-Mail-Fehler' : 'Kunde angelegt' }}</h3>
                    <p v-if="!newCredentials.error" class="modal-subtitle">
                        Die Zugangsdaten wurden an folgende E-Mail-Adresse gesendet:
                    </p>
                    <p v-else class="modal-subtitle" style="color: #991B1B;">
                        Der Kunde wurde angelegt, aber die E-Mail mit den Zugangsdaten konnte nicht gesendet werden.
                    </p>
                    <div class="credentials-box">
                        <div class="credential-row">
                            <span class="credential-label">E-Mail:</span>
                            <span class="credential-value">{{ newCredentials.email }}</span>
                        </div>
                        <div v-if="newCredentials.error" class="credential-row" style="background: #FEF2F2; border-radius: 8px; padding: 12px; margin-top: 12px;">
                            <span class="credential-label" style="color: #991B1B;">Fehler:</span>
                            <span class="credential-value" style="color: #7F1D1D; font-size: 0.85rem;">{{ newCredentials.error }}</span>
                        </div>
                    </div>
                    <div class="modal-actions">
                        <button v-if="!newCredentials.error" class="dashboard-btn" @click="copyEmail">E-Mail-Adresse kopieren</button>
                        <button class="dashboard-btn dashboard-btn-primary" @click="closeCredentialsModal">Verstanden</button>
                    </div>
                </div>
            </div>

            <!-- E-Mail ändern Modal -->
            <div v-if="showOwnEmailModal" class="modal-overlay" @click.self="closeOwnEmailModal">
                <div class="modal-card">
                    <h3>E-Mail-Adresse ändern</h3>
                    <div class="modal-field">
                        <label>Neue E-Mail-Adresse</label>
                        <input type="email" v-model="ownEmailForm.email" placeholder="name@unternehmen.at">
                    </div>
                    <div v-if="ownEmailError" class="form-error" style="margin-bottom: 12px;">{{ ownEmailError }}</div>
                    <div class="modal-actions">
                        <button class="dashboard-btn" @click="closeOwnEmailModal">Abbrechen</button>
                        <button class="dashboard-btn dashboard-btn-primary" @click="saveOwnEmail">E-Mail speichern</button>
                    </div>
                </div>
            </div>

            <!-- Eigenes Passwort ändern Modal -->
            <div v-if="showOwnPasswordModal" class="modal-overlay" @click.self="closeOwnPasswordModal">
                <div class="modal-card">
                    <h3>Mein Passwort ändern</h3>
                    <div class="modal-field">
                        <label>Aktuelles Passwort</label>
                        <input type="password" v-model="ownPasswordForm.current_password" placeholder="Aktuelles Passwort">
                    </div>
                    <div class="modal-field">
                        <label>Neues Passwort</label>
                        <input type="password" v-model="ownPasswordForm.new_password" placeholder="Mindestens 8 Zeichen">
                    </div>
                    <div class="modal-field">
                        <label>Passwort wiederholen</label>
                        <input type="password" v-model="ownPasswordForm.confirm_password" placeholder="Passwort wiederholen">
                    </div>
                    <div class="modal-actions">
                        <button class="dashboard-btn" @click="closeOwnPasswordModal">Abbrechen</button>
                        <button class="dashboard-btn dashboard-btn-primary" @click="saveOwnPassword">Passwort speichern</button>
                    </div>
                </div>
            </div>

            <div class="toast-container">
                <div v-for="toast in toasts" :key="toast.id" :class="'toast toast-' + toast.type">{{ toast.msg }}</div>
            </div>
        </div>
    </template>

    

    <!-- Modularisierte Scripts -->
    <script src="frontend/js/config.js?v=112"></script>
    <script src="frontend/js/utils/api.js?v=112"></script>
    <script src="frontend/js/utils/sounds.js?v=112"></script>
    <script src="frontend/js/utils/confetti.js?v=112"></script>
    <script src="frontend/js/utils/spinAnimation.js?v=112"></script>
    <script src="frontend/js/utils/auth.js?v=112"></script>
    <script src="frontend/js/components/WheelComponent.js?v=112"></script>
    <script src="frontend/js/components/SegmentImageEditor.js?v=112"></script>
    <script src="frontend/js/components/ColorPicker.js?v=112"></script>
    <script src="frontend/js/pages/EventPage.js?v=112"></script>
    <script src="frontend/js/pages/LandingPage.js?v=112"></script>
    <script src="frontend/js/pages/SettingsPage.js?v=112"></script>
    <script src="frontend/js/pages/DashboardPage.js?v=112"></script>
    <script src="frontend/js/app.js?v=112"></script>
</body>
</html>
